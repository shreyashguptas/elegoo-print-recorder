[project]
name = "elegoo-print-recorder"
version = "0.3.1"
description = "Automatically record every print from an Elegoo resin printer's camera on a Mac."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.scripts]
elegoo-print-recorder = "elegoo_print_recorder:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
